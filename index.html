<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MMR — Galerie Spirale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- "Google Sans" itself isn't a publicly redistributable webfont (Google
         restricts it to its own products) — Roboto is the closest
         Google-Fonts-hosted relative, used as the fallback for anyone
         without "Google Sans" already installed locally. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="gallery-canvas"></div>

      <header id="gallery-header">
        <div class="header-logo" aria-label="Musée des Maladies Rares">
          <img class="header-logo-img" src="/assets/logo-mmr.png" alt="Musée des Maladies Rares" />
        </div>

        <div class="header-tabs" role="tablist" aria-label="Mode d'affichage">
          <button type="button" class="header-tab is-active" data-tab="spirale" role="tab" aria-selected="true">
            Spirale
          </button>
          <button type="button" class="header-tab" data-tab="grille" role="tab" aria-selected="false">
            Grille
          </button>
        </div>

        <div class="header-actions">
          <button
            type="button"
            id="header-mute"
            class="header-icon-btn header-icon-btn--mute"
            aria-pressed="false"
            aria-label="Couper le son"
          >
            <svg class="icon-unmuted" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path

                fill="currentColor"
              />
            </svg>
            <svg class="icon-muted" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
              <path
                d="M12.1956 9.29228V5.80784C12.1956 5.36079 12.6795 5.08137 13.0667 5.3049C13.2463 5.40864 13.357 5.60036 13.357 5.80784V9.29228C13.357 9.73933 12.8731 10.0187 12.4859 9.79522C12.3062 9.69148 12.1956 9.49976 12.1956 9.29228ZM15.0993 4.06562C14.7785 4.0656 14.5185 4.32561 14.5185 4.64635V10.4538C14.5185 10.9008 15.0025 11.1802 15.3896 10.9567C15.5693 10.853 15.68 10.6612 15.68 10.4538V4.64635C15.68 4.32562 15.42 4.06562 15.0993 4.06562ZM14.3675 13.5477C14.6721 13.8749 14.5083 14.4091 14.0726 14.5093C13.8655 14.5569 13.649 14.4877 13.508 14.3288L10.4533 10.9684V14.5189C10.453 14.966 9.96884 15.245 9.58184 15.0212C9.55897 15.008 9.53703 14.9932 9.51616 14.977L4.44629 11.0345H1.16148C0.519994 11.0345 0 10.5145 0 9.87302V5.2271C0 4.58561 0.519994 4.06559 1.16148 4.06562H4.17771L1.89321 1.55246C1.59653 1.21804 1.77313 0.687861 2.21109 0.598136C2.40948 0.557492 2.61472 0.623136 2.75271 0.771367L14.3675 13.5477ZM9.29185 9.69082L5.23393 5.2271H1.16148V9.87302H4.64593C4.77513 9.87281 4.90066 9.91602 5.00236 9.9957L9.29185 13.3313V9.69082ZM7.33621 3.2896L9.29185 1.76515V6.00965C9.29185 6.4567 9.7758 6.73611 10.163 6.51258C10.3426 6.40884 10.4533 6.21712 10.4533 6.00965V0.581173C10.453 0.134117 9.96884 -0.144927 9.58184 0.0788856C9.55897 0.0921169 9.53703 0.106892 9.51616 0.123111L6.62335 2.37349C6.27431 2.65282 6.35856 3.20525 6.77499 3.36786C6.96284 3.4412 7.17529 3.41113 7.33621 3.2896Z"
                fill="currentColor"
              />
            </svg>
          </button>
          <button type="button" id="header-menu" class="header-icon-btn" aria-expanded="false" aria-label="Menu">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
              <path d="M15.681 5.88C15.681 6.24081 15.3885 6.53332 15.0276 6.53333H0.65431C0.151379 6.53336 -0.162952 5.98892 0.0884917 5.55336C0.205198 5.3512 0.420892 5.22667 0.65431 5.22667H15.0276C15.3885 5.22668 15.681 5.51919 15.681 5.88ZM0.65431 1.30667H15.0276C15.5306 1.30664 15.8449 0.762188 15.5934 0.326644C15.4767 0.124513 15.261 0 15.0276 0H0.65431C0.151379 0 -0.162958 0.544444 0.0885104 0.98C0.205217 1.18214 0.420898 1.30667 0.65431 1.30667ZM15.0276 10.4533H0.65431C0.151379 10.4533 -0.162958 10.9978 0.0885104 11.4333C0.205217 11.6355 0.420898 11.76 0.65431 11.76H15.0276C15.5306 11.76 15.8449 11.2155 15.5934 10.78C15.4767 10.5778 15.261 10.4533 15.0276 10.4533Z" fill="white" />
            </svg>
          </button>
        </div>
      </header>

      <div id="gallery-overlay" aria-live="polite">
        <div class="gallery-card-info">
          <h2 class="gallery-card-title" id="card-title"></h2>
          <a class="gallery-card-cta" id="card-cta" href="#">
            <span class="gallery-card-cta-label"></span>
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
