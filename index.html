<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MMR — Galerie Spirale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- "Google Sans" itself isn't a publicly redistributable webfont (Google
         restricts it to its own products) — Roboto is the closest
         Google-Fonts-hosted relative, used as the fallback for anyone
         without "Google Sans" already installed locally. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="gallery-canvas"></div>

      <header id="gallery-header">
        <div class="header-logo" aria-label="MMR">
          <!-- Stand-in text logo — swap for `<img class="header-logo-img"
               src="/assets/logo-mmr.svg" alt="MMR" />` once the real
               exported asset is available (see README "Notes"). -->
          <span class="header-logo-text">mmR</span>
        </div>

        <div class="header-tabs" role="tablist" aria-label="Mode d'affichage">
          <button type="button" class="header-tab is-active" data-tab="spirale" role="tab" aria-selected="true">
            Spirale
          </button>
          <button type="button" class="header-tab" data-tab="grille" role="tab" aria-selected="false">
            Grille
          </button>
        </div>

        <div class="header-actions">
          <button
            type="button"
            id="header-mute"
            class="header-icon-btn header-icon-btn--mute"
            aria-pressed="false"
            aria-label="Couper le son"
          >
            <svg class="icon-unmuted" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                d="M1.5 6H4L7.5 3.2v9.6L4 10H1.5V6Z"
                fill="currentColor"
              />
              <path
                d="M10.3 5.3c1.6 1.5 1.6 3.9 0 5.4M12 3.5c2.7 2.5 2.7 6.5 0 9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
            <svg class="icon-muted" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" hidden>
              <path
                d="M1.5 6H4L7.5 3.2v9.6L4 10H1.5V6Z"
                fill="currentColor"
              />
              <path
                d="M10.2 6.2l4 3.6M14.2 6.2l-4 3.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button type="button" id="header-menu" class="header-icon-btn" aria-expanded="false" aria-label="Menu">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <line x1="2" y1="4.5" x2="14" y2="4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              <line x1="2" y1="11.5" x2="14" y2="11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <div id="gallery-overlay" aria-live="polite">
        <div class="gallery-card-info">
          <h2 class="gallery-card-title" id="card-title"></h2>
          <a class="gallery-card-cta" id="card-cta" href="#">
            <span class="gallery-card-cta-label"></span>
            <span class="gallery-card-cta-arrow" aria-hidden="true">&rarr;</span>
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
